<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeLadder</title>
<style>
  :root{--bg:#0f1226;--card:#181c3a;--line:#2b3166;--ink:#eef0ff;--mute:#9aa0d0;--acc:#6c8cff;--ok:#38d39f;--bad:#ff6b81;--hl:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif;line-height:1.5}
  header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:20px}
  header h1 span{color:var(--acc)}
  .tag{color:var(--mute);font-size:13px}
  main{max-width:960px;margin:0 auto;padding:20px}
  .rungs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .rung{flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--mute);text-align:center}
  .rung.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
  .rung.done{border-color:var(--ok);color:var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{margin:0 0 8px;font-size:18px}
  .tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .task{cursor:pointer;transition:.15s}
  .task:hover{border-color:var(--acc);transform:translateY(-2px)}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;font-weight:600}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .opts{display:grid;gap:8px;margin:12px 0}
  .opt{text-align:left;background:#10132c;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .opt.right{border-color:var(--ok);background:#12332c}
  .opt.wrong{border-color:var(--bad);background:#3a1a28}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.split{grid-template-columns:1fr}}
  pre.code{margin:0;background:#0b0e22;border:1px solid var(--line);border-radius:8px;padding:10px 0;font-size:14px;overflow:auto}
  .ln{display:block;padding:1px 14px;cursor:pointer;white-space:pre}
  .ln:hover{background:#1c2250}
  .ln.hl{background:#4a3d12;box-shadow:inset 3px 0 var(--hl)}
  #flow svg{max-width:100%;height:auto}
  #flow .node{cursor:pointer}
  #flow .node.hl rect,#flow .node.hl polygon,#flow .node.hl path{stroke:var(--hl)!important;stroke-width:3px!important}
  .msg{padding:10px 12px;border-radius:8px;margin-top:8px}
  .msg.ok{background:#12332c;border:1px solid var(--ok)}
  .msg.bad{background:#3a1a28;border:1px solid var(--bad)}
  .out{background:#0b0e22;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;font-family:ui-monospace,Consolas,monospace}
  .bar{height:12px;background:#10132c;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--bad)}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row b{width:90px}
  .hint{color:var(--mute);font-size:13px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#10132c;border:1px solid var(--line);font-size:12px;color:var(--mute)}
  .post{border-left:3px solid var(--acc);padding:6px 10px;margin:8px 0;background:#10132c;border-radius:6px}
  textarea{width:100%;background:#0b0e22;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;margin:8px 0;font-family:inherit}
  #chatBtn{position:fixed;right:16px;bottom:16px;z-index:50;border-radius:999px;box-shadow:0 6px 20px #0008}
  #chat{position:fixed;right:16px;bottom:72px;z-index:50;width:340px;max-width:calc(100vw - 32px);height:440px;max-height:calc(100vh - 100px);display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #000a}
  #chat .top{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
  #chat .top small{display:block;color:var(--mute);font-weight:400;font-size:11px}
  #chatMsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .cm{padding:8px 10px;border-radius:10px;max-width:90%;font-size:14px}
  .cm.bot{background:#10132c;border:1px solid var(--line);align-self:flex-start}
  .cm.me{background:var(--acc);align-self:flex-end}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
  .chips button{padding:5px 9px;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;font-weight:500}
  #chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  #chat input{flex:1;background:#0b0e22;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Code<span>Ladder</span></h1>
  <div class="tag">Climb from plain words to real code. We find the missing rung.</div>
</header>
<main id="app"></main>

<button id="chatBtn" onclick="toggleChat()">Ask the guide</button>
<div id="chat">
  <div class="top">CodeLadder Guide<small>Guided assistant: hints and concept help</small></div>
  <div id="chatMsgs"></div>
  <div class="chips">
    <button onclick="sendChat('Give me a hint')">Give me a hint</button>
    <button onclick="sendChat('Explain my missing piece')">My missing piece</button>
    <button onclick="sendChat('What is a loop?')">What is a loop?</button>
    <button onclick="sendChat('What is indexing?')">What is indexing?</button>
  </div>
  <form onsubmit="sendChat();return false">
    <input id="chatIn" placeholder="Ask for a hint or a concept..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:false, theme:"dark", flowchart:{curve:"basis"}});
window.__mermaid = mermaid;
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js" defer></script>

<script>
/* ============ CONTENT (teammate: edit this section to add tasks, analogies, lessons) ============ */

const CONCEPTS = {
  loop: {
    name: "Loops (repeating a step)",
    lesson: "A loop repeats the same step for every item, so you don't write it again and again. Think of the hostel mess queue: the server does the same job (serve a plate) for each student until the line is empty. In code, 'for m in marks' means: take each mark, one at a time, and do the indented steps.",
    tryit: "Try: for n in [1, 2, 3]: print(n)  ->  prints 1, 2, 3 on separate lines."
  },
  variable: {
    name: "Variables (remembering a value)",
    lesson: "A variable is a labelled box that holds a value. Like a collection tin for a class fund: it starts at 0 and every time someone pays, you add to what is already inside. 'total = total + m' means: new total = old total + this mark.",
    tryit: "Try: total = 0, then total = total + 5 twice  ->  total is 10."
  },
  condition: {
    name: "Conditions (choosing a path)",
    lesson: "A condition is a yes/no question that decides which path to take, like the gate at the library: if you have an ID card, go in; else, go to the desk. 'average >= 75' is a question. Only the matching branch runs, and the other is skipped. Watch the boundary: 74.0 is NOT >= 75.",
    tryit: "Try: x = 74; if x >= 75: print('A') else: print('B')  ->  prints B."
  },
  indexing: {
    name: "Indexing (position vs value)",
    lesson: "Every item in a list has a position number starting from 0, like roll numbers that start at 0 instead of 1. scores[1] is the VALUE at position 1. The position itself is just 1. Mixing these up is the most common beginner slip: 'best' here stores a position, and names[best] looks up the person at that position.",
    tryit: "Try: names = ['Anu','Ben']; names[0] is 'Anu', names[1] is 'Ben'."
  }
};

const TASKS = [
  {
    id: "grade",
    title: "Class Grade Calculator",
    plain: "Take the marks of 5 subjects, add them up, find the average, and give grade A if the average is 75 or more, otherwise grade B.",
    sample: "Sample input: marks are 78, 65, 90, 55, 82",
    flow: `flowchart TD
A([Start]) --> B[Take the 5 marks]
B --> C[Set total = 0]
C --> D{More marks left?}
D -- yes --> E[Add next mark to total]
E --> D
D -- no --> F[average = total / 5]
F --> G{"average >= 75 ?"}
G -- yes --> H[grade = A]
G -- no --> I[grade = B]
H --> J([Show grade])
I --> J`,
    pseudo: [
      {t:"START", n:"A"},
      {t:"GET the 5 marks", n:"B"},
      {t:"SET total TO 0", n:"C"},
      {t:"FOR EACH mark", n:"D"},
      {t:"    ADD mark TO total", n:"E"},
      {t:"SET average TO total / 5", n:"F"},
      {t:"IF average IS 75 OR MORE", n:"G"},
      {t:"    grade IS A", n:"H"},
      {t:"OTHERWISE", n:"G"},
      {t:"    grade IS B", n:"I"},
      {t:"SHOW grade", n:"J"}
    ],
    code: [
      {t:"marks = [78, 65, 90, 55, 82]", n:"B"},
      {t:"total = 0", n:"C"},
      {t:"for m in marks:", n:"D"},
      {t:"    total = total + m", n:"E"},
      {t:"average = total / len(marks)", n:"F"},
      {t:"if average >= 75:", n:"G"},
      {t:"    grade = \"A\"", n:"H"},
      {t:"else:", n:"G"},
      {t:"    grade = \"B\"", n:"I"},
      {t:"print(grade)", n:"J"}
    ],
    expected: "B",
    q: {
      flow:   {ask:"Look at the flowchart. Which step repeats once for every mark?", opts:["Add next mark to total","Show grade","average = total / 5"], ans:0, concept:"loop",
               why:"The arrow from 'Add next mark to total' goes back to 'More marks left?'. That backward arrow IS the loop.",
               whyNot:["","'Show grade' runs only once, at the very end, after the loop has finished.","'average = total / 5' is worked out once after all marks are added, so it does not repeat."]},
      pseudo: {ask:"After the FOR EACH finishes, what is total? (marks: 78, 65, 90, 55, 82)", opts:["370","82","5"], ans:0, concept:"variable",
               why:"total keeps growing: 78, 143, 233, 288, 370. It remembers the running sum.",
               whyNot:["","82 is only the last mark. total adds up every mark, it does not keep just the last one.","5 is how many marks there are, not their sum."]},
      py:     {ask:"What will this program print?", opts:["A","B","74.0"], ans:1, concept:"condition",
               why:"370 / 5 = 74.0, and 74.0 is not >= 75, so the else branch runs. Grade B.",
               whyNot:["Grade A needs an average of 75 or more. The average is 74.0, just 1 short.","","74.0 is the average, but the program prints the grade, not the average."]}
    }
  },
  {
    id: "topper",
    title: "Find the Topper",
    plain: "Given 3 students and their scores, find and show the name of the student with the highest score.",
    sample: "Sample input: Anu 72, Ben 88, Cara 65",
    flow: `flowchart TD
A([Start]) --> B[Take names and scores]
B --> C[best = position 0]
C --> D{More positions to check?}
D -- yes --> E{"score here > score at best ?"}
E -- yes --> F[best = this position]
E -- no --> D
F --> D
D -- no --> G([Show name at best])`,
    pseudo: [
      {t:"START", n:"A"},
      {t:"GET names and scores", n:"B"},
      {t:"SET best TO position 0", n:"C"},
      {t:"FOR EACH position i", n:"D"},
      {t:"    IF score at i IS MORE THAN score at best", n:"E"},
      {t:"        SET best TO i", n:"F"},
      {t:"SHOW the name at position best", n:"G"}
    ],
    code: [
      {t:"names = [\"Anu\", \"Ben\", \"Cara\"]", n:"B"},
      {t:"scores = [72, 88, 65]", n:"B"},
      {t:"best = 0", n:"C"},
      {t:"for i in range(len(scores)):", n:"D"},
      {t:"    if scores[i] > scores[best]:", n:"E"},
      {t:"        best = i", n:"F"},
      {t:"print(names[best])", n:"G"}
    ],
    expected: "Ben",
    q: {
      flow:   {ask:"What does the diamond inside the repeat compare?", opts:["The score at this position vs the best score so far","A name vs a score","The first score vs the last score"], ans:0, concept:"condition",
               why:"Each round asks: is this score bigger than the best one I have seen so far? If yes, update best.",
               whyNot:["","Names are text and scores are numbers. The program never compares them.","It compares every score with the best so far, not just the first and the last."]},
      pseudo: {ask:"What does 'best' remember?", opts:["The highest score itself","The position of the highest score","The student's name"], ans:1, concept:"indexing",
               why:"best holds a position (0, 1 or 2), not the score. We use it later to look up both score and name.",
               whyNot:["If best held the score, we could not find the name. It holds the position, which gives us both.","","The name is looked up at the end with names[best]. best itself only stores a number."]},
      py:     {ask:"What will this program print?", opts:["88","1","Ben"], ans:2, concept:"indexing",
               why:"best ends at position 1. names[1] is 'Ben'. (scores[1] would be 88, and best itself is 1.)",
               whyNot:["88 is scores[best], but the program prints names[best], which is a name.","1 is the value of best, but print shows names[best], the name at that position.",""]}
    }
  },
    {
    id: "pass",
    title: "Count Passing Students",
    plain: "Given the marks of 5 students, count how many passed. A student passes with 40 or more.",
    sample: "Sample input: marks are 45, 72, 38, 91, 60",
    flow: `flowchart TD
A([Start]) --> B[Take the marks]
B --> C[Set count = 0]
C --> D{More marks left?}
D -- yes --> E{"mark >= 40 ?"}
E -- yes --> F[Add 1 to count]
E -- no --> D
F --> D
D -- no --> G([Show count])`,
    pseudo: [
      {t:"START", n:"A"},
      {t:"GET the marks", n:"B"},
      {t:"SET count TO 0", n:"C"},
      {t:"FOR EACH mark", n:"D"},
      {t:"    IF mark IS 40 OR MORE", n:"E"},
      {t:"        ADD 1 TO count", n:"F"},
      {t:"SHOW count", n:"G"}
    ],
    code: [
      {t:"marks = [45, 72, 38, 91, 60]", n:"B"},
      {t:"count = 0", n:"C"},
      {t:"for m in marks:", n:"D"},
      {t:"    if m >= 40:", n:"E"},
      {t:"        count = count + 1", n:"F"},
      {t:"print(count)", n:"G"}
    ],
    expected: "4",
    q: {
      flow:   {ask:"What happens in the flowchart when a mark is below 40?", opts:["It is skipped and the loop moves to the next mark","The program stops","1 is added to count anyway"], ans:0, concept:"condition",
               why:"The 'no' arrow from 'mark >= 40 ?' goes straight back to 'More marks left?'. Nothing is added.",
               whyNot:["","There is no arrow from 'no' to an end box. The loop carries on with the next mark.","Adding 1 happens only on the 'yes' path."]},
      pseudo: {ask:"What does count remember?", opts:["The total of all the marks","How many marks have passed so far","The highest mark"], ans:1, concept:"variable",
               why:"count starts at 0 and goes up by 1 only when a mark passes. It is a counter, not a sum.",
               whyNot:["A sum would be total = total + m. Here we add 1, not the mark.","","Nothing in this program looks for the highest mark."]},
      py:     {ask:"What will this program print?", opts:["5","4","306"], ans:1, concept:"condition",
               why:"45, 72, 91 and 60 pass. 38 fails. So count ends at 4.",
               whyNot:["5 would count every mark. 38 is below 40, so it is not counted.","","306 is the sum of the marks. This program counts passes instead."]}
    }
  },
    {
    id: "find",
    title: "Find a Student's Position",
    plain: "Given 4 student names, find the position of Cara in the list and show it.",
    sample: "Sample input: Anu, Ben, Cara, Dev. Looking for Cara",
    flow: `flowchart TD
A([Start]) --> B[Take the names and the target]
B --> C[position = -1]
C --> D{More positions to check?}
D -- yes --> E{"name here = target ?"}
E -- yes --> F[position = this position]
E -- no --> D
F --> D
D -- no --> G([Show position])`,
    pseudo: [
      {t:"START", n:"A"},
      {t:"GET the names and the target", n:"B"},
      {t:"SET position TO -1", n:"C"},
      {t:"FOR EACH position i", n:"D"},
      {t:"    IF the name at i IS the target", n:"E"},
      {t:"        SET position TO i", n:"F"},
      {t:"SHOW position", n:"G"}
    ],
    code: [
      {t:"names = [\"Anu\", \"Ben\", \"Cara\", \"Dev\"]", n:"B"},
      {t:"target = \"Cara\"", n:"B"},
      {t:"position = -1", n:"C"},
      {t:"for i in range(len(names)):", n:"D"},
      {t:"    if names[i] == target:", n:"E"},
      {t:"        position = i", n:"F"},
      {t:"print(position)", n:"G"}
    ],
    expected: "2",
    q: {
      flow:   {ask:"Why does position start at -1?", opts:["So we can tell if the name was never found","Because lists start at -1","To skip the first name"], ans:0, concept:"variable",
               why:"-1 is not a real position. If position is still -1 at the end, the name was never found.",
               whyNot:["","Lists start at 0, not -1. The -1 is just a marker we chose.","Nothing is skipped. Every position is checked."]},
      pseudo: {ask:"What does the check at 'IF the name at i IS the target' compare?", opts:["The name at position i with the target","The number i with the target","The target with itself"], ans:0, concept:"condition",
               why:"names[i] is the name at position i. Each round asks: is this the name we want?",
               whyNot:["","i is a number and the target is a name. They would never match.","Comparing the target with itself is always true and finds nothing."]},
      py:     {ask:"Cara is the 3rd student in the line. What does this program print?", opts:["3","2","Cara"], ans:1, concept:"indexing",
               why:"Positions start at 0: Anu is 0, Ben is 1, Cara is 2. The program prints the position, 2.",
               whyNot:["3 is Cara's place when counting from 1. List positions count from 0.","","The program prints the position number, not the name."]}
    }
  }
];

/* ============ APP LOGIC ============ */

const STAGES = ["Describe","Flowchart","Pseudocode","Python","Diagnosis"];
const S = {task:null, stage:0, picked:null, misses:{}, hits:{}, ranCode:false, pyodide:null, pyLoading:false};
const $ = s => document.querySelector(s);
const app = $("#app");

function resetStats(){ S.misses={}; S.hits={}; }
function bump(map, k){ map[k] = (map[k]||0)+1; }

function rungsBar(){
  return `<div class="rungs">` + STAGES.map((n,i)=>
    `<div class="rung ${i===S.stage?'on':''} ${i<S.stage?'done':''}">${i+1}. ${n}</div>`).join("") + `</div>`;
}

function home(){
  S.task=null; S.stage=0; S.picked=null; resetStats();
  app.innerHTML = `
    <div class="card">
      <h2>Most beginners don't fail because coding is hard.</h2>
      <p>They fail because <b>one missing piece</b> breaks the ladder. Pick a task and climb: plain words, flowchart, pseudocode, Python. At each rung you predict first. We spot the exact concept you're missing.</p>
    </div>
    <div class="tasks">
      ${TASKS.map((t,i)=>`<div class="card task" onclick="practiceGo(this,${i})"><h2>${t.title}</h2><p class="hint">${t.plain}</p><span class="pill">4 rungs · 3 predictions</span></div>`).join("")}
      <div class="card task" onclick="glitchGo(this,'Study Circles',()=>circlesHome())"><h2>Study Circles</h2><p class="hint">Join learners who are stuck on the same missing piece.</p><span class="pill">community</span></div>
    </div>`;
}

function startTask(i){
  S.task = TASKS[i]; S.stage=0; S.picked=null; S.ranCode=false;
  render();
}

function render(){
  const t = S.task;
  if(S.stage===0) return renderDescribe(t);
  if(S.stage===1) return renderFlow(t);
  if(S.stage===2) return renderPseudo(t);
  if(S.stage===3) return renderPython(t);
  return renderDiagnosis(t);
}

function renderDescribe(t){
  app.innerHTML = rungsBar() + `
    <div class="card"><h2>${t.title}</h2>
      <p style="font-size:18px">"${t.plain}"</p>
      <p class="hint">${t.sample}</p>
      <p>Rung 1 is just words. Read it, then climb: the next rungs turn this sentence into code.</p>
      <button onclick="next()">Climb to the flowchart</button> <button class="ghost" onclick="home()">Back</button>
    </div>`;
}

function questionHTML(key){
  const q = S.task.q[key];
  return `<div class="card"><h2>Predict first</h2><p>${q.ask}</p>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer('${key}',${i})">${o}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
}

async function renderFlow(t){
  app.innerHTML = rungsBar() + `
    <div class="card"><h2>Rung 2: Flowchart</h2><p class="hint">Tip: click any box to see it in the code later.</p>
      <div id="flow">Drawing...</div></div>` + questionHTML("flow") + navHTML(false);
  try{
    await waitFor(()=>window.__mermaid, 6000);
    const {svg} = await window.__mermaid.render("g"+Date.now(), t.flow);
    $("#flow").innerHTML = svg;
    wireFlowClicks(null);
  }catch(e){
    $("#flow").innerHTML = `<pre class="code" style="padding:10px">${t.flow.replace(/</g,"&lt;")}</pre><p class="hint">(Flowchart library did not load: check internet. Showing the text version.)</p>`;
  }
}

function waitFor(fn, ms){
  return new Promise((res,rej)=>{
    const t0=Date.now();
    (function tick(){ if(fn()) return res(); if(Date.now()-t0>ms) return rej(); setTimeout(tick,100); })();
  });
}

function nodeEls(n){
  return [...document.querySelectorAll("#flow g.node")].filter(g=>{
    const m = g.id.match(/flowchart-(.+)-\d+$/); return m && m[1]===n;
  });
}
function clearHL(){ document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl")); }
function hlNode(n){ nodeEls(n).forEach(e=>e.classList.add("hl")); }
function hlLines(n){ document.querySelectorAll(`.ln[data-n="${n}"]`).forEach(e=>e.classList.add("hl")); }

function wireFlowClicks(){
  document.querySelectorAll("#flow g.node").forEach(g=>{
    const m = g.id.match(/flowchart-(.+)-\d+$/); if(!m) return;
    g.addEventListener("click",()=>{ clearHL(); hlNode(m[1]); hlLines(m[1]); });
  });
}

function linesHTML(arr){
  return arr.map(l=>`<span class="ln" data-n="${l.n}" onclick="lineClick('${l.n}')">${l.t.replace(/</g,"&lt;")||" "}</span>`).join("");
}
function lineClick(n){ clearHL(); hlLines(n); hlNode(n); }

async function renderPseudo(t){
  app.innerHTML = rungsBar() + `
    <div class="split">
      <div class="card"><h2>Flowchart</h2><div id="flow">Drawing...</div></div>
      <div class="card"><h2>Rung 3: Pseudocode</h2><p class="hint">Plain steps. Click a line to light up its flowchart box.</p><pre class="code">${linesHTML(t.pseudo)}</pre></div>
    </div>` + questionHTML("pseudo") + navHTML(false);
  await drawFlowSmall(t);

function answer(key, i){

  const mine = (!ok && q.whyNot && q.whyNot[i]) ? q.whyNot[i] + "<br><br>" : "";

  $("#fb").innerHTML = `<div class="msg ${ok?'ok':'bad'}"><b>${ok?'Correct.':'Not quite.'}</b> ${mine}${right}${q.why}` +

async function runCode(){
  const out = $("#out"); out.textContent = "Running...";
  const src = S.task.code.map(l=>l.t).join("\n");
  let text;
  try{
    const py = await Promise.race([loadPy(), new Promise((_,r)=>setTimeout(()=>r(new Error("slow")),15000))]);
    py.runPython(`import sys, io\n_buf = io.StringIO()\nsys.stdout = _buf`);
    py.runPython(src);
    text = py.runPython("_buf.getvalue()");
    py.runPython("sys.stdout = sys.__stdout__");
  }catch(e){
    text = S.task.expected + "\n(stored output: Python engine not loaded)";
  }
  out.textContent = text.trim();
  $("#nav").querySelector("#nextBtn") ? ($("#nextBtn").disabled=false) : null;
  S.ranCode = true;
}

const CHAT = {hints:{}, started:false};
const CMATCH = {
  loop:/loop|repeat|iterat|for each/,
  variable:/variable|total|store|remember|running/,
  condition:/condition|\bif\b|else|decision|choose|branch|>=/,
  indexing:/index|position|list|roll number|\[/

function currentQ(){
  if(!S.task || S.stage<1 || S.stage>3) return null;
  const k = keyForStage();
  return {id:S.task.id+":"+k, q:S.task.q[k]};
}
function topMissed(){
  const ks = Object.keys(S.misses).filter(k=>S.misses[k]>0).sort((a,b)=>S.misses[b]-S.misses[a]);
  return ks[0] || null;
}
function conceptReply(c){
  const x = CONCEPTS[c];
  return `<b>${x.name}</b><br>${x.lesson}<br><span class="hint">${x.tryit}</span>`;
}
function askAssistant(text){
  const t = text.toLowerCase();
  const cq = currentQ();
  if(/hint|stuck|clue|help me|don.?t know|confus/.test(t)){
    if(!cq) return "Hints work while a prediction question is on screen. For now, ask me about loops, variables, conditions or indexing.";
    const n = CHAT.hints[cq.id] || 0;
    CHAT.hints[cq.id] = Math.min(n+1, 2);
    const c = CONCEPTS[cq.q.concept];
    if(n===0) return `<b>Hint 1:</b> Look at the ${STAGES[S.stage].toLowerCase()} above. This question tests <b>${c.name}</b>. What exactly is it asking you to find?`;
    if(n===1) return `<b>Hint 2:</b> ${c.lesson}`;
    return `<b>Hint 3 (the answer):</b> ${cq.q.opts[cq.q.ans]}.<br>${cq.q.why}`;
  }
  if(/missing|my weak|my mistake|where did i/.test(t)){
    const c = topMissed();
    return c ? "Your biggest missing piece so far:<br>" + conceptReply(c) : "You have no wrong answers yet. Ask me about any concept if you want to learn more.";
  }
  for(const c in CMATCH){ if(CMATCH[c].test(t)) return conceptReply(c); }
  if(/^(hi|hello|hey)\b/.test(t)) return "Hi! I'm the CodeLadder guide. Ask for a <b>hint</b>, or ask about loops, variables, conditions or indexing.";
  return "I can give <b>hints</b> on your current question and explain four ideas: loops, variables, conditions and indexing. Try the buttons below.";
}

function showCosmic(){

  el.innerHTML = `

    <div class="cap" id="cap0"><h1>Welcome to CodeLadder</h1><p>Scroll to fall in</p><div class="chev">&#8964;</div></div>

    <div class="cbar"><i id="cbar"></i></div>
    <button class="ghost cskip" id="cskip">Skip</button>
    <div class="cld" id="cld">
      <div class="hole"><i class="ring"></i><i class="ring r2"></i><b class="core"></b></div>
      <h2>Building your ladder</h2>
      <p class="hint" id="cmsg">Finding your missing rung...</p>
      <div class="lbar"><i></i></div>
    </div>`;
  document.body.appendChild(el);

  const v = el.querySelector("#cvid"), sc = el.querySelector("#csc");
  const caps = [el.querySelector("#cap0"), el.querySelector("#cap1"), el.querySelector("#cap2")];
  const bar = el.querySelector("#cbar");
  let cur = 0, dur = 6, done = false, bad = false, gone = false;

  v.addEventListener("loadedmetadata", () => { dur = v.duration || 6; try{ v.currentTime = 0.001; }catch(e){} });
  v.addEventListener("error", () => {
    bad = true;
    caps[0].innerHTML = `<h1>Welcome to CodeLadder</h1><p>(video error ${v.error ? v.error.code : "?"})</p><button class="cbeg" id="cbeg">Begin</button>`;
    caps[0].style.opacity = 1;
    sc.style.display = "none";
    el.querySelector("#cbeg").onclick = startLoad;
  });

  function leave(next){
    if(gone) return; gone = true;
    next();
    el.style.transition = "opacity .5s"; el.style.opacity = 0;
    setTimeout(() => el.remove(), 520);
  }
  el.querySelector("#cskip").onclick = () => leave(() => sitePage('home'));

  function startLoad(){
    if(done) return; done = true;
    sc.style.overflowY = "hidden";
    el.querySelector("#cld").classList.add("on");
    const msgs = ["Finding your missing rung...", "Sorting loops from variables...", "Building your ladder..."];
    let i = 0;
    const tm = setInterval(() => { i = (i+1) % msgs.length; const m = el.querySelector("#cmsg"); if(m) m.textContent = msgs[i]; }, 1200);
    setTimeout(() => { clearInterval(tm); leave(() => sitePage('home')); }, 3600);
  }

  function fade(p, a, b){
    if(p < a || p > b) return 0;
    const x = (p - a) / (b - a);
    return Math.max(0, Math.min(1, x/0.25, (1-x)/0.25));
  }
  function frame(){
    if(gone || !document.body.contains(el)) return;
    if(!bad){
      const m = sc.scrollHeight - sc.clientHeight;
      const target = m > 0 ? Math.min(1, sc.scrollTop / m) : 0;
      cur += (target - cur) * 0.12;
      if(Math.abs(target - cur) < 0.0005) cur = target;
      const t = cur * Math.max(0, dur - 0.05);
      if(!v.seeking && Math.abs(v.currentTime - t) > 0.016){ try{ v.currentTime = t; }catch(e){} }
      caps[0].style.opacity = Math.max(0, 1 - cur/0.18);
      caps[1].style.opacity = fade(cur, 0.22, 0.58);
      caps[2].style.opacity = fade(cur, 0.62, 0.97);
      bar.style.width = (cur*100) + "%";
      if(!done && cur > 0.985) startLoad();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => { try{ sc.focus(); }catch(e){} }, 50);
}

const SX_TOOLS = {
  grade:  {inputs:() => numRow(["78","65","90","55","82"], "Subject"), run: v => { const n = v.nums(5); if(!n) return "Enter 5 marks, each between 0 and 100."; const t = n.reduce((x,y)=>x+y,0), avg = t/5; return `Total ${t}, average ${avg.toFixed(1)}, grade ${avg >= 75 ? "A" : "B"}.`; }},

           run: v => { const nm = v.names(), mk = v.nums(3); if(!mk || nm.some(x=>!x)) return "Enter 3 names and 3 scores (0 to 100)."; let b = 0; mk.forEach((m,i)=>{ if(m > mk[b]) b = i; }); return `Topper: ${nm[b]} with ${mk[b]}.`; }},

           run: v => { const n = v.nums(5); if(!n) return "Enter 5 marks, each between 0 and 100."; const c = n.filter(m => m >= 40).length; return `${c} of 5 passed (pass mark is 40).`; }},

function numRow(vals, lab){ return `<div class="sx-row">${vals.map((m,i)=>`<div><label>${lab} ${i+1}</label><input class="mk" type="number" min="0" max="100" value="${m}"></div>`).join("")}</div>`; }

    .concat([{title:"Study Circles", sub:"Join learners who are stuck on the same missing piece.", mark:"+", hue:350, tag:"Open circles", go:() => circlesHome()}]);
}
function sxCfHTML(items){
  return items.map(it => `<div class="sx-cf-card" style="--h:${it.hue}"><span class="m">${it.mark}</span><h3>${it.title}</h3><p>${it.sub}</p><span class="pill">${it.tag}</span></div>`).join("");
}
/* place cards for a (fractional) position; loop wraps around like the reference */
function sxCfPlace(box, pos, loop){
  const cards = box.children, n = cards.length, cw = cards[0] ? cards[0].offsetWidth : 250, step = cw*0.97;
  for(let i = 0; i < n; i++){
    let d = i - pos; if(loop) d = ((d + n/2) % n + n) % n - n/2;
    const a = Math.abs(d), c = cards[i], s = 1 - Math.min(a,1)*0.2 - Math.max(0,Math.min(a-1,1.5))*0.08;
    c.style.transform = `translate(-50%,-50%) translateX(${d*step}px) scale(${s})`;
    c.style.opacity = Math.max(0, 1 - Math.max(0,a-1)*0.4);
    c.style.filter = `brightness(${1 - Math.min(a,1)*0.22})`;
    c.style.zIndex = 100 - Math.round(a*10);
    c.style.pointerEvents = a > 2.6 ? "none" : "auto";
  }
}
function sxCfMount(box, items){
  const n = items.length, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pos = 0, tgt = 0, held = 0, x0 = null, moved = false;
  const idx = () => ((Math.round(pos) % n) + n) % n;
  const go = k => { tgt = k; held = performance.now() + 6000; };
  [...box.children].forEach((c,i) => c.onclick = () => {
    if(moved) return;
    const d = ((i - pos + n/2) % n + n) % n - n/2;
    if(Math.abs(d) < 0.5) items[i].go(); else go(Math.round(pos + d));
  });
  box.addEventListener("pointerdown", e => { x0 = e.clientX; moved = false; });
  box.addEventListener("pointerup", e => { if(x0 === null) return; const dx = e.clientX - x0; x0 = null; if(Math.abs(dx) > 40){ moved = true; go(Math.round(tgt) + (dx < 0 ? 1 : -1)); setTimeout(() => moved = false, 50); } });
  box.addEventListener("keydown", e => { if(e.key === "ArrowRight") go(Math.round(tgt)+1); if(e.key === "ArrowLeft") go(Math.round(tgt)-1); });
  box.tabIndex = 0;
  box.sxStep = k => go(Math.round(tgt) + k);
  clearInterval(SITE.cft);
  if(!reduce) SITE.cft = setInterval(() => { if(performance.now() > held && document.body.contains(box)) tgt = Math.round(tgt) + 1; }, 3200);
  (function loop(){
    if(!document.body.contains(box)){ clearInterval(SITE.cft); return; }
    pos += (tgt - pos) * 0.12; sxCfPlace(box, pos, true);
    SITE.raf2 = requestAnimationFrame(loop);
  })();
}

function siteStory(){
  cancelAnimationFrame(SITE.raf);
  const story = document.getElementById("sxstory"); if(!story) return;
  const cv = story.querySelector("canvas"), ctx = cv.getContext("2d");
  const caps = story.querySelectorAll(".sx-cap");
  const prog = document.getElementById("sxprog"), hint = document.getElementById("sxhint");
  const WORDS = ["for","if","{","}","i++","[0]","=","()","while","print","x",">","else","def","in","len","==","+=","return","0","1",";"];
  let seed = 11; const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;

  const N = 64, toks = [];
  for(let i=0;i<N;i++){
    const a = rnd()*6.283, r = 0.3 + 0.45*rnd();
    toks.push({ w:WORDS[i % WORDS.length], col:i%8, row:(i/8)|0,
      sx:Math.cos(a)*r, sy:Math.sin(a)*r*0.8, d:rnd()*0.45, ph:rnd()*6.283,
      rot:(rnd()-0.5)*2.2, sc:rnd()*0.8-0.2 });
  }
  const embers = Array.from({length:46}, () => ({a:rnd()*6.283, r:0.1+rnd()*0.5, s:0.5+rnd(), z:rnd()}));

  const mix = (c1,c2,t) => [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
  const GREY=[222,208,190], ORG=[255,138,43], WARM=[255,244,224];
  const fade = (p,a,b) => { if(p<a||p>b) return 0; const x=(p-a)/(b-a); return clamp(Math.min(x/0.22,(1-x)/0.22)); };

  let W=0, H=0, dpr=1;
  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.max(1, W*dpr); cv.height = Math.max(1, H*dpr);
  }
  size();

  function draw(p, tm){
    if(cv.clientWidth !== W || cv.clientHeight !== H) size();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const t1 = clamp(p/0.34), t2 = clamp((p-0.34)/0.34), t3 = clamp((p-0.68)/0.3);
    const cx = W/2, cy = H/2;
    ctx.fillStyle = "#06070b"; ctx.fillRect(0,0,W,H);

    // geometry
    const fs = clamp(W/60, 12, 19);
    ctx.font = `600 ${fs}px ui-monospace,Menlo,Consolas,monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const gw = clamp(W*0.06, 34, 78), gh = clamp(H*0.065, 26, 52);
    const mobile = W < 700;
    const lw = mobile ? clamp(W*0.5,150,230) : clamp(W*0.3, 200, 340);
    const lh = mobile ? H*0.5 : H*0.78, top = mobile ? H*0.1 : H*0.11;
    const lcx = mobile ? cx : lerp(cx, W*0.28, ease(clamp(t3*2.5)));
    const lx0 = lcx - lw/2;

    // glows: flash on shatter, sunrise when the ladder stands
    const flash = Math.max(0, 1 - Math.abs(t1-0.3)/0.3) * 0.5 * (1-t2);
    if(flash > 0){ const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.7); g.addColorStop(0,`rgba(255,110,30,${flash})`); g.addColorStop(1,"rgba(255,110,30,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    const sun = ease(t3) * 0.55;
    if(sun > 0){ const g = ctx.createRadialGradient(lcx,H*1.05,0,lcx,H*1.05,H*1.0); g.addColorStop(0,`rgba(255,150,60,${sun})`); g.addColorStop(1,"rgba(255,150,60,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }

    // editor panel behind the intact code
    const panel = 1 - ease(clamp(t1*3));
    if(panel > 0.01){
      ctx.globalAlpha = panel*0.9; ctx.fillStyle = "#120e0b"; ctx.strokeStyle = "#2e2218"; ctx.lineWidth = 1;
      const pw = gw*8 + 30, ph = gh*8 + 54, px = cx-pw/2, py = cy-ph/2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px,py,pw,ph,14) : ctx.rect(px,py,pw,ph); ctx.fill(); ctx.stroke();

    // ladder skeleton (rails + rungs), appears as pieces connect, lights up from the bottom
    const sk = ease(clamp((t2-0.45)/0.55));

      ctx.lineCap = "round";
      [lx0, lx0+lw].forEach(x => { ctx.strokeStyle = `rgba(255,138,43,${0.35*sk})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top+lh); ctx.stroke(); });
      for(let r=0;r<8;r++){
        const y = top + lh*(r+0.5)/8, lit = clamp(t3*1.7 - (1 - (r+0.5)/8));
        ctx.strokeStyle = `rgba(255,${150+90*lit|0},${70+120*lit|0},${(0.22*sk + 0.7*lit)})`; ctx.lineWidth = 2 + 1.5*lit;
        ctx.shadowColor = "rgba(255,150,60,.9)"; ctx.shadowBlur = 14*lit;
        ctx.beginPath(); ctx.moveTo(lx0, y); ctx.lineTo(lx0+lw, y); ctx.stroke(); ctx.shadowBlur = 0;
      }

    // embers
    embers.forEach(e => {

    // code tokens: grid -> scatter -> ladder
    toks.forEach((k,i) => {
      const q1 = ease(clamp((t1 - k.d)/0.55)), q2 = ease(clamp((t2 - k.d)/0.55));
      const gx = cx + (k.col-3.5)*gw, gy = cy + (k.row-3.5)*gh + 8;
      let lxp, lyp, ly01;
      let yoff = 0;

      else if(i < 40){ lxp = lx0+lw; ly01 = (i-20)/19; }
      else { const r = ((i-40)/3)|0, j = (i-40)%3; lxp = lx0 + lw*(j+1)/4; ly01 = (r+0.5)/8; yoff = -fs*0.85; }

      ctx.save(); ctx.translate(x,y); ctx.rotate(k.rot*amp); ctx.scale(1+k.sc*amp, 1+k.sc*amp);

    });

  function frame(tm){
    if(!document.body.contains(story)) return;
    const r = story.getBoundingClientRect();
    if(r.bottom < 0 || r.top > innerHeight){ SITE.raf = requestAnimationFrame(frame); return; }

  }

}

/* ============ ADDED: GLITCH LOADING TRANSITION + FALLING-CODE BACKGROUND ============
   1) glitchGo(el,label,cb): fullscreen dot-matrix / falling-code / glitch / zoom transition, used only by
      Practice options and Study Circles options (see practiceGo, circleGo, circleJoinGo, glitchGo on the Practice->Study Circles card).
   2) #sxrain: one fixed falling-code canvas shown behind How it works, Concepts, Practice, Study Circles and About only.
   Nothing above this block was rewritten; home(), circlesHome(), openCircle(), sitePage() are wrapped, not replaced. */
(function(){
  const REDUCE = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
  const ease  = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
  const hash  = (a,b) => { let x = (Math.imul(a|0,374761393) + Math.imul(b|0,668265263))|0; x = Math.imul(x ^ (x>>>13), 1274126177); return ((x ^ (x>>>16))>>>0) / 4294967296; };
  const MONO  = 'ui-monospace,Menlo,Consolas,"Courier New",monospace';
  const GLYPHS = "01{}[]()<>=+-*/;:#$%&|!?_~^".split("").concat(["if","for","i++","[0]","==","def"]);

  const st = document.createElement("style");
  st.textContent = `
  #glx{position:fixed;inset:0;width:100vw;max-width:100vw;height:100vh;height:100dvh;margin:0;padding:0;box-sizing:border-box;z-index:2147483000;background:#02030a;overflow:hidden;touch-action:none;overscroll-behavior:contain;cursor:progress;transition:opacity .45s ease}
  #glx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #glx .glx-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6))}
  #glx .glx-ui{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 20px calc(26px + env(safe-area-inset-bottom,0px)) 20px;text-align:center;font:600 13px/1.4 ${MONO};letter-spacing:.2em;text-transform:uppercase;color:#d6e6ff;text-shadow:0 0 10px #3d7bff}
  #glx .glx-ui i{display:inline-block;width:.6em;height:1em;margin-left:.4em;vertical-align:-.15em;background:#d6e6ff;animation:glxBlink .7s steps(2) infinite}
  @keyframes glxBlink{50%{opacity:0}}
  .glx-hit{animation:glxHit .24s ease-out both}
  @keyframes glxHit{0%{transform:scale(1)}45%{transform:scale(.965);box-shadow:0 0 0 2px #6c8cff,0 0 28px rgba(108,140,255,.7)}100%{transform:scale(.985);box-shadow:0 0 0 2px #fff,0 0 36px rgba(255,255,255,.5)}}
  .glx-reveal{animation:glxReveal .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes glxReveal{from{opacity:0;transform:scale(1.035);filter:blur(10px) brightness(1.8)}to{opacity:1;transform:none;filter:none}}
  #sxrain{position:fixed;inset:0;width:100vw;max-width:100vw;height:100vh;height:100dvh;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s ease}
  @media (prefers-reduced-motion:reduce){.glx-hit,.glx-reveal{animation:none}#glx{transition:opacity .15s}}`;
  document.head.appendChild(st);

  /* ---------- fullscreen transition ---------- */
  const GLX = {busy:false};

  function glitchGo(el, label, cb){
    if(GLX.busy) return;                       // no duplicate / overlapping transitions
    GLX.busy = true;
    const reduce = REDUCE();
    let ox = innerWidth/2, oy = innerHeight/2;
    try{
      if(el && el.classList) el.classList.add("glx-hit");
      if(el && el.getBoundingClientRect){ const r = el.getBoundingClientRect(); ox = r.left + r.width/2; oy = r.top + r.height/2; }
    }catch(e){}
    setTimeout(() => {
      try{ run(String(label||""), cb, ox, oy, reduce); }
      catch(err){ console.error(err); try{ cb && cb(); }catch(e2){ console.error(e2); } const o = document.getElementById("glx"); if(o) o.remove(); GLX.busy = false; }
    }, reduce ? 0 : 170);
  }

  function run(label, cb, ox, oy, reduce){
    const ov = document.createElement("div");
    ov.id = "glx"; ov.setAttribute("role","status"); ov.setAttribute("aria-label","Loading " + label);
    ov.innerHTML = `<canvas></canvas><div class="glx-scan"></div><div class="glx-ui"><span></span><i></i></div>`;
    ov.querySelector(".glx-ui span").textContent = "Loading // " + label;
    const block = e => e.preventDefault();
    ov.addEventListener("wheel", block, {passive:false}); ov.addEventListener("touchmove", block, {passive:false});
    document.body.appendChild(ov);

    let cbDone = false, closed = false, fading = false, raf = 0, safety = 0;
    const t0 = performance.now();
    const doCb = () => {
      if(cbDone) return; cbDone = true;
      try{ cb && cb(); }catch(e){ console.error(e); }
      try{ window.scrollTo(0,0); }catch(e){}
      const a = document.getElementById("app");
      if(a){ a.classList.remove("glx-reveal"); void a.offsetWidth; a.classList.add("glx-reveal"); setTimeout(() => a.classList.remove("glx-reveal"), 800); }
    };
    const close = () => {
      if(closed) return; closed = true;
      cancelAnimationFrame(raf); clearTimeout(safety);
      removeEventListener("resize", onResize); removeEventListener("orientationchange", onResize);
      ov.remove(); GLX.busy = false;
    };
    const fadeOut = () => { if(fading) return; fading = true; ov.style.pointerEvents = "none"; ov.style.opacity = "0"; setTimeout(close, 520); };
    safety = setTimeout(() => { doCb(); fadeOut(); }, 3800);       // always finishes, even if rAF is throttled

    if(reduce){                                   // reduced motion: short static dark screen, no animation
      ov.querySelector("canvas").remove(); ov.querySelector(".glx-scan").remove();
      ov.querySelector(".glx-ui").style.cssText += ";top:0;display:flex;align-items:center;justify-content:center";
      setTimeout(() => { doCb(); setTimeout(fadeOut, 60); }, 350);
      const onResize = () => {}; return;
    }

    /* circular reveal from the clicked card, then it covers the whole viewport */
    ov.style.clipPath = `circle(0px at ${ox}px ${oy}px)`;
    ov.style.transition = "opacity .45s ease, clip-path .34s cubic-bezier(.2,.7,.2,1)";
    requestAnimationFrame(() => requestAnimationFrame(() => { ov.style.clipPath = `circle(${Math.hypot(innerWidth, innerHeight)*1.1}px at ${ox}px ${oy}px)`; }));
    setTimeout(() => { if(!closed) ov.style.clipPath = "none"; }, 420);

    const cv = ov.querySelector("canvas"), ctx = cv.getContext("2d");
    const ui = ov.querySelector(".glx-ui");
    let W, H, dpr, cell, cols, rows, lx, ly, lthr, ltint, rain;

    function buildMask(){
      const oc = document.createElement("canvas"); oc.width = cols; oc.height = rows;
      const o = oc.getContext("2d", {willReadFrequently:true});
      o.fillStyle = "#000"; o.fillRect(0,0,cols,rows); o.fillStyle = "#fff"; o.textAlign = "center"; o.textBaseline = "middle";
      const words = label.toUpperCase().split(/\s+/).filter(Boolean);
      const split = (ws,n) => { if(n===1) return [ws.join(" ")]; const tgt = ws.join(" ").length/n, out = []; let cur = "";
        ws.forEach(w => { if(cur && cur.length+1+w.length > tgt*1.15 && out.length < n-1){ out.push(cur); cur = w; } else cur = cur ? cur+" "+w : w; }); out.push(cur); return out; };
      let best = null;
      o.font = `700 100px ${MONO}`;
      for(let n=1; n<=Math.min(3, Math.max(1,words.length)); n++){
        const lines = split(words, n), mw = Math.max.apply(null, lines.map(l => o.measureText(l).width));
        const f = Math.min(100*cols*0.9/Math.max(1,mw), rows*0.34/(n*1.15));
        if(!best || f > best.f) best = {f, lines};
      }
      o.font = `700 ${Math.max(5,best.f)}px ${MONO}`;
      best.lines.forEach((l,i) => o.fillText(l, cols/2, rows*0.46 + (i-(best.lines.length-1)/2)*best.f*1.15));
      const d = o.getImageData(0,0,cols,rows).data;
      lx = []; ly = []; lthr = []; ltint = [];
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(d[(r*cols+c)*4] > 128){
        lx.push(c); ly.push(r); lthr.push(hash(c*7+1, r*13+5)); const q = hash(c+91, r+17); ltint.push(q < .10 ? 1 : q < .15 ? 2 : 0);
      }
    }
    function layout(){
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      W = ov.clientWidth || innerWidth; H = ov.clientHeight || innerHeight;      // always the real viewport size
      cv.width = Math.max(1, Math.round(W*dpr)); cv.height = Math.max(1, Math.round(H*dpr));
      cell = Math.max(7, Math.min(12, Math.round(Math.sqrt(W*H)/110)));
      cols = Math.ceil(W/cell); rows = Math.ceil(H/cell);
      buildMask();
      rain = []; for(let c=0;c<cols;c+=2) rain.push({c, sp:16+Math.random()*34, off:Math.random()*(rows+24), len:7+Math.floor(Math.random()*13)});
    }
    function onResize(){ if(!closed) layout(); }
    addEventListener("resize", onResize); addEventListener("orientationchange", onResize);
    layout();

    const TB = 520, TG = 960, TC = 1300, TF = 1360;      // build, glitch->burst, navigate under white-out, fade out
    const trailCols = []; for(let i=0;i<20;i++) trailCols.push(i===0 ? "#eaf3ff" : `rgba(${90+i*2},${150+i*2},255,${(Math.pow(1-i/20,1.6)*0.85).toFixed(3)})`);

    function draw(t){
      const build = clamp(t/TB), burst = clamp((t-TG)/(TC-TG)), b = ease(burst);
      const zoom = 1 + 0.10*clamp(t/TG) + Math.pow(b,2)*5.5;
      ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.fillStyle = "#02030a"; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.setTransform(dpr*zoom,0,0,dpr*zoom, dpr*W/2*(1-zoom), dpr*H/2*(1-zoom));
      const hw = W/(2*zoom), hh = H/(2*zoom);                     // only the visible part is drawn when zoomed
      const c0 = Math.max(0, Math.floor((W/2-hw)/cell)-1), c1 = Math.min(cols, Math.ceil((W/2+hw)/cell)+1);
      const r0 = Math.max(0, Math.floor((H/2-hh)/cell)-1), r1 = Math.min(rows, Math.ceil((H/2+hh)/cell)+1);
      const slot = Math.floor(t/70);
      const gl = t < 380 ? hash(slot,3) < .12 : (t < TG+60 ? hash(slot,7) < .55 : false);

      /* dim LED grid covering every cell of the screen */
      ctx.fillStyle = `rgba(110,140,255,${0.09+0.06*build})`; ctx.beginPath();
      const gs = cell-2; for(let r=r0;r<r1;r++) for(let c=c0;c<c1;c++) ctx.rect(c*cell+1, r*cell+1, gs, gs);
      ctx.fill();

      /* falling code, edge to edge */
      const ra = (1 - 0.6*clamp((t-TB)/(TG-TB))) * clamp(t/160);
      ctx.font = `${(cell*1.7).toFixed(1)}px ${MONO}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for(let i=0;i<20;i++){
        ctx.fillStyle = trailCols[i]; ctx.globalAlpha = ra;
        for(let k=0;k<rain.length;k++){
          const col = rain[k]; if(i >= col.len || col.c < c0-1 || col.c > c1) continue;
          const head = (t/1000*col.sp + col.off) % (rows + col.len + 2), rr = Math.floor(head) - i;
          if(rr < r0-1 || rr > r1) continue;
          const g = GLYPHS[Math.floor(hash(col.c*13 + (i===0 ? Math.floor(t/150) : 0), rr+1000) * GLYPHS.length)];
          ctx.fillText(g, col.c*cell + cell/2, rr*cell + cell/2);
        }
      }
      ctx.globalAlpha = 1;

      /* title assembled out of dots (dot-matrix look from the reference) with RGB split, echo and slice shifts */
      const p = clamp((t-100)/(TB-100));
      const bands = []; if(gl) for(let k=0;k<3;k++) bands.push([Math.floor(hash(slot,k+11)*rows), 2+Math.floor(hash(slot,k+21)*8), Math.floor((hash(slot,k+31)-.5)*cols*.18)]);
      const shiftOf = r => { for(let k=0;k<bands.length;k++){ const bd = bands[k]; if(r >= bd[0] && r < bd[0]+bd[1]) return bd[2]; } return 0; };
      const ds = cell-1.5, split = gl ? (1+hash(slot,5)*2.2)*cell*.9 : cell*.22;
      const pass = (fill, alpha, dx, only) => {
        ctx.fillStyle = fill; ctx.globalAlpha = alpha; ctx.beginPath();
        for(let i=0;i<lx.length;i++){ if(lthr[i] > p) continue; if(only !== undefined && ltint[i] !== only) continue; ctx.rect((lx[i]+shiftOf(ly[i]))*cell + dx + .75, ly[i]*cell + .75, ds, ds); }
        ctx.fill();
      };
      if(p > 0){
        pass("rgba(255,225,70,1)", .8, split); pass("rgba(70,130,255,1)", .8, -split);
        if(gl && hash(slot,9) < .5) pass("rgba(255,255,255,1)", .32, cols*cell*.045*(hash(slot,8)<.5?-1:1));
        pass("rgba(255,255,255,1)", .96, 0, 0); pass("rgba(90,160,255,1)", 1, 0, 1); pass("rgba(255,222,60,1)", 1, 0, 2);
        ctx.globalAlpha = 1;
      }

      /* burst: rays, glow, white-out and LED-grid gaps (zoom into the matrix) */
      if(burst > 0){
        const cx = W/2, cy = H/2, R = Math.hypot(W,H);
        ctx.globalCompositeOperation = "lighter";
        for(let k=0;k<16;k++){
          const ang = k/16*Math.PI*2 + hash(k,1)*.4, len = R*(.15+.9*b)*(.5+hash(k,2)), wd = cell*(2+hash(k,3)*5)*(.6+b);
          const ex = cx+Math.cos(ang)*len, ey = cy+Math.sin(ang)*len, nx = -Math.sin(ang)*wd/2, ny = Math.cos(ang)*wd/2;
          const g = ctx.createLinearGradient(cx,cy,ex,ey);
          g.addColorStop(0,"rgba(255,255,255,.9)"); g.addColorStop(.5,"rgba(60,120,255,.55)"); g.addColorStop(1,"rgba(60,120,255,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx+nx,cy+ny); ctx.lineTo(ex,ey); ctx.lineTo(cx-nx,cy-ny); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = `rgba(255,220,60,${.45*(1-b*.5)})`; ctx.lineWidth = Math.max(1, cell*.18); ctx.beginPath(); ctx.moveTo(cx+nx,cy+ny); ctx.lineTo(ex,ey); ctx.stroke();
        }
        const rg = ctx.createRadialGradient(cx,cy,0,cx,cy,R*.75*b+1);
        rg.addColorStop(0,"rgba(255,255,255,1)"); rg.addColorStop(.55,"rgba(255,255,255,.9)"); rg.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle = rg; ctx.fillRect(-W,-H,3*W,3*H);
        if(b > .82){ ctx.fillStyle = `rgba(255,255,255,${clamp((b-.82)/.18)})`; ctx.fillRect(-W,-H,3*W,3*H); }
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = `rgba(5,8,22,${(0.85*b).toFixed(3)})`; ctx.lineWidth = Math.max(1.4, cell*.16); ctx.beginPath();
        for(let c=c0;c<=c1;c++){ ctx.moveTo(c*cell, r0*cell); ctx.lineTo(c*cell, r1*cell); }
        for(let r=r0;r<=r1;r++){ ctx.moveTo(c0*cell, r*cell); ctx.lineTo(c1*cell, r*cell); }
        ctx.stroke();
      }

      /* full-screen tear slices on glitch frames */
      ctx.setTransform(1,0,0,1,0,0);
      if(gl && t < TG+60) for(let k=0;k<2;k++){
        const y = Math.floor(hash(slot,41+k)*cv.height), h = Math.floor((8+hash(slot,43+k)*60)*dpr), dx = Math.round((hash(slot,45+k)-.5)*70*dpr);
        ctx.drawImage(cv, 0, y, cv.width, h, dx, y, cv.width, h);
      }
      ui.style.opacity = 1 - clamp((t-TG)/200);
    }

    function frame(now){
      raf = requestAnimationFrame(frame);
      const t = now - t0;
      try{
        draw(Math.max(0,t));
        if(t >= TC) doCb();
        if(t >= TF) fadeOut();
      }catch(e){ console.error(e); doCb(); fadeOut(); cancelAnimationFrame(raf); }
    }
    raf = requestAnimationFrame(frame);
  }

  window.glitchGo = glitchGo;
  window.practiceGo   = (el,i) => glitchGo(el, TASKS[i].title, () => startTask(i));
  window.circleGo     = (el,c) => glitchGo(el, shortName(c) + " circle", () => openCircle(c));
  window.circleJoinGo = (el,c) => {
    if(GLX.busy) return;
    if(!COMM.name){ const n = (prompt("Your name for the study circle?") || "").trim(); COMM.name = n || "Learner"; }   // same prompt as before, asked before the animation
    glitchGo(el, "Joining " + shortName(c) + " circle", () => joinCircle(c));
  };

  /* ---------- falling-code background (How it works, Concepts, Practice, Study Circles, About) ---------- */
  const RN = {cv:null, ctx:null, on:false, raf:0, last:0, W:0, H:0, dpr:1, fs:15, cols:[], gl:null, nextGl:0, hideT:0};
  const RCH = "01{}[]()<>=+-*/;:#$%&|!?_~^abcdefxyz".split("");
  function rainInit(){
    if(RN.cv) return;
    const cv = document.createElement("canvas"); cv.id = "sxrain"; cv.setAttribute("aria-hidden","true");
    document.body.appendChild(cv); RN.cv = cv; RN.ctx = cv.getContext("2d");
    addEventListener("resize", () => { if(RN.on) rainSize(); });
    document.addEventListener("visibilitychange", () => { if(document.hidden) cancelAnimationFrame(RN.raf); else if(RN.on) rainStart(); });
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener && matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => { if(RN.on) rainStart(); });
  }
  function rainSize(){
    const cv = RN.cv; RN.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    RN.W = cv.clientWidth || innerWidth; RN.H = cv.clientHeight || innerHeight;
    cv.width = Math.round(RN.W*RN.dpr); cv.height = Math.round(RN.H*RN.dpr);
    RN.fs = RN.W < 700 ? 13 : 15; const sp = RN.fs*1.3, n = Math.ceil(RN.W/sp);
    RN.cols = []; for(let i=0;i<n;i++) RN.cols.push({x:i*sp + sp/2, y:Math.random()*RN.H*1.4 - RN.H*.3, v:35+Math.random()*75, len:8+Math.floor(Math.random()*14), s:Math.floor(Math.random()*1e6)});
    if(REDUCE()) rainDraw(0);
  }
  function rainDraw(dt){
    const c = RN.ctx, W = RN.W, H = RN.H, fs = RN.fs, lh = fs*1.15, now = performance.now();
    c.setTransform(RN.dpr,0,0,RN.dpr,0,0); c.clearRect(0,0,W,H);
    c.font = `${fs}px ${MONO}`; c.textAlign = "center"; c.textBaseline = "middle";
    if(!REDUCE() && now > RN.nextGl && !RN.gl){ RN.gl = {until:now+140, y:Math.random()*H, h:30+Math.random()*70, dx:(Math.random()<.5?-1:1)*(8+Math.random()*16)}; RN.nextGl = now + 2500 + Math.random()*3500; }
    if(RN.gl && now > RN.gl.until) RN.gl = null;
    const g = RN.gl;
    for(const col of RN.cols){
      if(!REDUCE()){ col.y += col.v*dt; if(col.y - col.len*lh > H){ col.y = -Math.random()*H*.4; col.v = 35+Math.random()*75; col.len = 8+Math.floor(Math.random()*14); col.s++; } }
      for(let i=0;i<col.len;i++){
        const y = col.y - i*lh; if(y < -lh || y > H+lh) continue;
        const row = Math.floor(y/lh), ch = RCH[Math.floor(hash(col.s + Math.floor(col.x), row + (i===0 ? Math.floor(now/180) : 0)) * RCH.length)];
        const a = i===0 ? .55 : .3*Math.pow(1-i/col.len, 1.6); if(a < .02) continue;
        let x = col.x;
        if(g && y > g.y && y < g.y+g.h){ c.fillStyle = `rgba(255,122,26,${a*.8})`; c.globalAlpha = 1; c.fillText(ch, x - g.dx*1.4, y); x += g.dx; }
        c.fillStyle = i===0 ? "#cfe6ff" : "#6fa4ff"; c.globalAlpha = a; c.fillText(ch, x, y);
      }
    }
    c.globalAlpha = 1;
  }
  function rainLoop(ts){
    if(!RN.on || document.hidden) return;
    RN.raf = requestAnimationFrame(rainLoop);
    if(ts - RN.last < 33) return;                     // ~30 fps cap keeps CPU low
    const dt = Math.min(.05, (ts - RN.last)/1000); RN.last = ts; rainDraw(dt);
  }
  function rainStart(){
    cancelAnimationFrame(RN.raf); if(!RN.cols.length) rainSize();
    if(REDUCE()){ rainDraw(0); return; }               // reduced motion: one static frame, no loop
    RN.last = performance.now(); RN.raf = requestAnimationFrame(rainLoop);
  }
  function rainSet(on){
    rainInit(); clearTimeout(RN.hideT);
    if(on && !RN.on){ RN.on = true; rainSize(); rainStart(); requestAnimationFrame(() => RN.cv.style.opacity = ".6"); }
    else if(!on && RN.on){ RN.on = false; RN.cv.style.opacity = "0"; RN.hideT = setTimeout(() => { if(!RN.on) cancelAnimationFrame(RN.raf); }, 650); }
  }
  /* which views get the rain: views tagged by the wrappers below; any other render clears the tag */
  const mark = () => { const el = app.firstElementChild; if(el) el.classList.add("rain-on"); };
  const wrap = name => { const orig = window[name]; window[name] = function(){ const r = orig.apply(this, arguments); mark(); return r; }; };
  wrap("home"); wrap("circlesHome"); wrap("openCircle");           // Practice, Study Circles list, a circle's page
  const _sitePage = window.sitePage;
  window.sitePage = function(name){ const r = _sitePage.apply(this, arguments); if(name === "how" || name === "concepts" || name === "about") mark(); return r; };
  new MutationObserver(() => rainSet(!!app.querySelector(".rain-on"))).observe(app, {childList:true});
})();

showCosmic();
</script>
